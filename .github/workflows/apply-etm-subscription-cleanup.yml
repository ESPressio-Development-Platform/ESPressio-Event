name: Apply ETM subscription cleanup

on:
  push:
    branches:
      - feature/57-rtti-free-memory-efficiency
    paths:
      - tools/apply_etm_subscription_cleanup_fix.py
      - .github/workflows/apply-etm-subscription-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/57-rtti-free-memory-efficiency
          fetch-depth: 0
      - name: Apply guarded transformation
        run: python tools/apply_etm_subscription_cleanup_fix.py
      - name: Validate patch
        run: |
          python tools/check_event_transport_subscription_cleanup.py
          git diff --check
      - name: Commit source and tests
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ESPressio_EventTransportManager.hpp tools/check_event_transport_subscription_cleanup.py .github/workflows/tests.yml
          git commit -m 'fix: preserve Event transport subscription cleanup'
          git push origin HEAD:feature/57-rtti-free-memory-efficiency
