name: one-shot-etm-outbound-offload

on:
  push:
    branches:
      - feature/57-rtti-free-memory-efficiency
    paths:
      - .github/workflows/etm-outbound-offload-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/57-rtti-free-memory-efficiency
          fetch-depth: 0

      - name: Apply guarded ETM outbound offload
        run: python3 .github/scripts/patch_etm_outbound_offload.py

      - name: Validate patch
        run: |
          git diff --check
          git diff -- src/ESPressio_EventTransportManager.hpp

      - name: Commit ETM refactor
        run: |
          git config user.name "ESPressio Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/ESPressio_EventTransportManager.hpp
          git commit -m "refactor: offload Event transport outbound execution"
          git push origin HEAD:feature/57-rtti-free-memory-efficiency
