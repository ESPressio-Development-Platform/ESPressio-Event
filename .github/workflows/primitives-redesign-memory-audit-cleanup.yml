name: Temporary Memory Audit Cleanup
on:
  push:
    branches: [primitives_redesign]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: primitives_redesign, fetch-depth: 0}
      - name: Remove ESPressio Memory Audit comment blocks
        shell: python
        run: |
          import pathlib, re
          extensions={'.h','.hh','.hpp','.hxx','.c','.cc','.cpp','.cxx','.ipp','.tpp','.ino'}
          start='* ESPressio Memory Audit'; end='* End ESPressio Memory Audit'
          comment=re.compile(r'/\*.*?\*/', re.DOTALL); changed=[]; removed=0
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in extensions: continue
              original=path.read_text(encoding='utf-8'); hits=[]
              def replace(match):
                  block=match.group(0)
                  if start in block and end in block: hits.append(1); return ''
                  return block
              updated=comment.sub(replace, original)
              if hits: path.write_text(updated, encoding='utf-8'); changed.append(str(path)); removed += len(hits)
          print(f'Removed {removed} ESPressio Memory Audit blocks from {len(changed)} files')
          for path in changed: print(path)
      - name: Verify markers are gone
        shell: bash
        run: |
          if grep -R -n --include='*.h' --include='*.hh' --include='*.hpp' --include='*.hxx' --include='*.c' --include='*.cc' --include='*.cpp' --include='*.cxx' --include='*.ipp' --include='*.tpp' --include='*.ino' 'ESPressio Memory Audit' . --exclude-dir=.git; then exit 1; fi
      - name: Commit cleanup if required
        shell: bash
        run: |
          if git diff --quiet; then echo 'No memory audit comments found.'; exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u && git commit -m 'chore: remove ESPressio Memory Audit comments' && git push origin HEAD:primitives_redesign
