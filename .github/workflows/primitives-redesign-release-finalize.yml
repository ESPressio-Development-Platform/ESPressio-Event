name: Temporary Release Flattening Finalizer
on:
  push:
    branches: [primitives_redesign]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: primitives_redesign}
      - name: Finalize pilot cleanup
        shell: python
        run: |
          import pathlib,re
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() in {'.h','.hh','.hpp','.hxx','.c','.cc','.cpp','.cxx','.ipp','.tpp','.ino'}:
                  try:s=p.read_text(encoding='utf-8')
                  except:continue
                  s=re.sub(r'(?i)\b(old|legacy|prior|previous|historical)\s+(\d+\.\d+(?:\.\d+)?)\b',r'\1',s)
                  p.write_text(s,encoding='utf-8')
          r=pathlib.Path('README.md')
          if r.exists(): r.write_text(r.read_text(encoding='utf-8').replace('For the  Event layer','For the Event layer'),encoding='utf-8')
          for q in [pathlib.Path('.github/workflows/primitives-redesign-version-audit.yml'),pathlib.Path('.github/workflows/primitives-redesign-release-finalize.yml')]:
              if q.exists():q.unlink()
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: finalize historical release flattening'
          git push origin HEAD:primitives_redesign
