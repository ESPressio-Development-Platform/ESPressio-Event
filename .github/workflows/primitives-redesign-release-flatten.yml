name: Temporary Release Flattening
on:
  push:
    branches: [primitives_redesign]
permissions:
  contents: write
jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitives_redesign
          fetch-depth: 0
      - name: Remove historical release material
        shell: python
        run: |
          import pathlib, re, shutil

          root = pathlib.Path('.')
          self_path = root / '.github/workflows/primitives-redesign-release-flatten.yml'
          exact_root = {
              'dependency_boundaries.md', 'optimisations.md',
              'platform_abstractions.md', 'security_integration.md'
          }
          version = r'(?:\d+\.(?:\d+|x)(?:\.(?:\d+|x))?(?:[-+][0-9A-Za-z.-]+)?)'
          semver = r'(?:\d+\.\d+(?:\.\d+)?(?:[-+][0-9A-Za-z.-]+)?)'
          libs = r'(?:Command|ESP-Now|ESP32|Event|Logging|MeshAdapters|Mesh|NRF24|Observable|Persistence|Primitive|Radio|Security|Serial|Serializable|Sockets|State|System|Task|Threads|Timing|Units|Web|WiFi)'

          deleted = []
          for p in list(root.iterdir()):
              if not p.is_file():
                  continue
              low = p.name.lower()
              if (low.startswith('changelog') and p.suffix.lower() == '.md') or low in exact_root:
                  p.unlink(); deleted.append(str(p))
          for p in list(root.rglob('*')):
              if not p.is_file() or p == self_path:
                  continue
              low = p.name.lower()
              if p.suffix.lower() == '.md' and (
                  low.startswith('changelog') or
                  low.startswith('release_notes') or low.startswith('release-notes') or
                  re.match(r'release[_-]\d', low)
              ):
                  p.unlink(); deleted.append(str(p))
          if (root / 'wiki').exists():
              shutil.rmtree(root / 'wiki'); deleted.append('wiki/')

          libver = re.compile(
              rf'(?i)\b((?:ESPressio[- ]?)?{libs})'
              rf'(?:\s+(?:v(?:ersion)?\s*)?|\s*)'
              rf'(?:[<>=~^]+\s*)?{version}'
              rf'(?:\s*[<>=~^]+\s*{version})?\+?'
          )
          verb_in_ver = re.compile(
              rf'(?i)\b(introduced|added|changed|fixed|removed|updated|corrected|released|implemented|established|raised|lowered|migrated)'
              rf'\s+(?:back\s+)?in\s+(?:release\s+|version\s+)?v?{version}\b'
          )
          since_ver = re.compile(rf'(?i)\b(?:since|as of)\s+(?:release\s+|version\s+)?v?{version}\b')
          ver_noun = re.compile(rf'(?i)\b(?:the\s+)?v?{version}\s+(migration|architecture|release|baseline|series|line|model|contract|layer|restructuring)\b')
          tag_url = re.compile(rf'(?i)(https?://[^\s)\]"\']*ESPressio[^\s)\]"\']*?)(?:/releases/tag/|/tree/|/blob/|/raw/)(?:v?{semver})(?=[/\s)\]"\']|$)')
          deleted_ref = re.compile(
              r'(?i)(?:CHANGELOG(?:[-_][^\s)\]]*)?\.md|DEPENDENCY_BOUNDARIES\.md|OPTIMISATIONS\.md|PLATFORM_ABSTRACTIONS\.md|SECURITY_INTEGRATION\.md|(?:^|[/`])wiki/[^\s)`\]]*)'
          )
          version_field = re.compile(rf'(?i)(["\']version["\']\s*:\s*["\'])[^"\']*{semver}[^"\']*(["\'])')

          def clean_text(text, dependency_chart=False, esp_context=False):
              if dependency_chart:
                  text = re.sub(version, '', text)
              text = libver.sub(lambda m: m.group(1), text)
              text = verb_in_ver.sub(lambda m: m.group(1), text)
              text = since_ver.sub('', text)
              text = ver_noun.sub(lambda m: m.group(1), text)
              text = re.sub(r'(?i)\b1\.0\.0\s+baseline\b', 'Current baseline', text)
              text = re.sub(r'\b1\.0\.0\b', '', text)
              text = tag_url.sub(lambda m: m.group(1) + '/tree/primitives_redesign', text)
              if esp_context:
                  text = version_field.sub(lambda m: m.group(1) + '*' + m.group(2), text)
              text = re.sub(r'(?<=\w) {2,}(?=[,.;:])', ' ', text)
              text = re.sub(r'\s+([,.;:])', r'\1', text)
              text = re.sub(r'\b(?:for|at|in|from|since|as of)\s+([,.;:])', r'\1', text, flags=re.I)
              return text

          doc_exts = {'.md','.markdown','.rst','.txt','.adoc','.svg'}
          code_exts = {'.h','.hh','.hpp','.hxx','.c','.cc','.cpp','.cxx','.ipp','.tpp','.ino'}
          changed = []

          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path == self_path:
                  continue
              ext = path.suffix.lower()
              if ext in doc_exts:
                  try: original = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  dependency_chart = 'dependency_chart' in path.name.lower()
                  src_lines = original.splitlines(keepends=True)
                  out_lines = []
                  recent = []
                  for line in src_lines:
                      ending = '\n' if line.endswith('\n') else ''
                      body = line[:-1] if ending else line
                      if deleted_ref.search(body):
                          continue
                      if re.match(r'^#{1,6}\s+(?:Changelog|Release History|Version History)\s*$', body, re.I):
                          continue
                      esp_context = bool(re.search(r'(?i)ESPressio', body) or any('ESPressio' in x for x in recent[-4:]))
                      cleaned = clean_text(body, dependency_chart, esp_context)
                      out_lines.append(cleaned + ending)
                      recent.append(body)
                  updated = ''.join(out_lines)
                  if updated != original:
                      path.write_text(updated, encoding='utf-8'); changed.append(str(path))
              elif ext in code_exts:
                  try: original = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  out=[]; i=0; in_block=False; quote=None
                  while i < len(original):
                      if in_block:
                          j = original.find('*/', i)
                          if j < 0:
                              out.append(clean_text(original[i:])); i=len(original); break
                          out.append(clean_text(original[i:j])); out.append('*/'); i=j+2; in_block=False; continue
                      ch = original[i]
                      if quote:
                          out.append(ch)
                          if ch == '\\' and i+1 < len(original):
                              out.append(original[i+1]); i += 2; continue
                          if ch == quote: quote=None
                          i += 1; continue
                      if ch in {'"', "'"}:
                          quote=ch; out.append(ch); i+=1; continue
                      if original.startswith('//', i):
                          j=original.find('\n', i)
                          if j < 0: j=len(original)
                          out.append('//' + clean_text(original[i+2:j])); i=j; continue
                      if original.startswith('/*', i):
                          out.append('/*'); i+=2; in_block=True; continue
                      out.append(ch); i+=1
                  updated=''.join(out)
                  if updated != original:
                      path.write_text(updated, encoding='utf-8'); changed.append(str(path))

          if self_path.exists(): self_path.unlink(); deleted.append(str(self_path))
          print('Deleted:'); [print('  ' + x) for x in deleted]
          print('Changed:'); [print('  ' + x) for x in changed]
      - name: Verify flattened state
        shell: python
        run: |
          import pathlib,re,sys
          root=pathlib.Path('.')
          failures=[]
          exact={'dependency_boundaries.md','optimisations.md','platform_abstractions.md','security_integration.md'}
          for p in root.iterdir():
              if p.is_file() and (p.name.lower() in exact or (p.name.lower().startswith('changelog') and p.suffix.lower()=='.md')):
                  failures.append(str(p))
          if (root/'wiki').exists(): failures.append('wiki/')
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower()=='.md' and (p.name.lower().startswith('changelog') or p.name.lower().startswith('release_notes') or p.name.lower().startswith('release-notes') or re.match(r'release[_-]\d',p.name.lower())):
                  failures.append(str(p))

          version=r'(?:\d+\.(?:\d+|x)(?:\.(?:\d+|x))?(?:[-+][0-9A-Za-z.-]+)?)'
          libs=r'(?:Command|ESP-Now|ESP32|Event|Logging|MeshAdapters|Mesh|NRF24|Observable|Persistence|Primitive|Radio|Security|Serial|Serializable|Sockets|State|System|Task|Threads|Timing|Units|Web|WiFi)'
          suspect=re.compile(rf'(?i)(?:\b(?:ESPressio[- ]?)?{libs}\s*(?:v(?:ersion)?\s*)?(?:[<>=~^]+\s*)?{version}|\b(?:introduced|added|changed|fixed|removed|updated|corrected|released|implemented|established|raised|lowered|migrated)\s+(?:back\s+)?in\s+(?:release\s+|version\s+)?v?{version}|\b(?:since|as of)\s+(?:release\s+|version\s+)?v?{version}|\b1\.0\.0\b)')
          doc_exts={'.md','.markdown','.rst','.txt','.adoc','.svg'}
          code_exts={'.h','.hh','.hpp','.hxx','.c','.cc','.cpp','.cxx','.ipp','.tpp','.ino'}

          def comment_text(text):
              parts=[]; i=0; block=False; quote=None
              while i<len(text):
                  if block:
                      j=text.find('*/',i)
                      if j<0: parts.append(text[i:]); break
                      parts.append(text[i:j]); i=j+2; block=False; continue
                  ch=text[i]
                  if quote:
                      if ch=='\\' and i+1<len(text): i+=2; continue
                      if ch==quote: quote=None
                      i+=1; continue
                  if ch in {'"',"'"}: quote=ch; i+=1; continue
                  if text.startswith('//',i):
                      j=text.find('\n',i)
                      if j<0: j=len(text)
                      parts.append(text[i+2:j]); i=j; continue
                  if text.startswith('/*',i): i+=2; block=True; continue
                  i+=1
              return '\n'.join(parts)

          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              ext=p.suffix.lower()
              if ext not in doc_exts|code_exts: continue
              try: text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              scan=text if ext in doc_exts else comment_text(text)
              if 'dependency_chart' in p.name.lower() and re.search(version, scan):
                  failures.append(f'{p}: dependency chart still contains a release-like version')
              for n,line in enumerate(scan.splitlines(),1):
                  if suspect.search(line): failures.append(f'{p}:{n}:{line}')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: flatten historical release references'
          git push origin HEAD:primitives_redesign
