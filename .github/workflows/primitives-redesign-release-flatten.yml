name: Temporary Release Flattening
on:
  push:
    branches: [primitives_redesign]
permissions:
  contents: write
jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitives_redesign
          fetch-depth: 0
      - name: Flatten historical ESPressio release material
        shell: python
        run: |
          import pathlib, re, shutil

          root = pathlib.Path('.')
          self_path = root/'.github/workflows/primitives-redesign-release-flatten.yml'
          named = {'dependency_boundaries.md','optimisations.md','platform_abstractions.md','security_integration.md'}

          # Remove point-of-release/history artifacts that will be regenerated.
          for p in list(root.iterdir()):
              if p.is_file() and ((p.name.lower().startswith('changelog') and p.suffix.lower()=='.md') or p.name.lower() in named):
                  p.unlink()
          for p in list(root.rglob('*')):
              if not p.is_file() or p == self_path or p.suffix.lower() != '.md':
                  continue
              n=p.name.lower()
              if n.startswith('changelog') or n.startswith('release_notes') or n.startswith('release-notes') or re.match(r'release[_-]\d', n):
                  p.unlink()
          if (root/'wiki').exists(): shutil.rmtree(root/'wiki')

          ver=r'\d+\.(?:\d+|x)(?:\.(?:\d+|x))?(?:[-+][0-9A-Za-z.-]+)?'
          libs=r'(?:Command|ESP-Now|ESP32|Event|Logging|MeshAdapters|Mesh|NRF24|Observable|Persistence|Primitive|Radio|Security|Serial|Serializable|Sockets|State|System|Task|Threads|Timing|Units|Web|WiFi)'
          libver=re.compile(rf'(?i)\b((?:ESPressio[- ]?)?{libs})\s+(?:v(?:ersion)?\s*)?(?:[<>=~^]+\s*)?{ver}(?:\s*[<>=~^]+\s*{ver})?\+?')
          history=re.compile(rf'(?i)\b(introduced|added|changed|fixed|removed|updated|corrected|released|implemented|established|raised|lowered|migrated)\s+(?:back\s+)?in\s+(?:release\s+|version\s+)?v?{ver}\b')
          since=re.compile(rf'(?i)\b(?:since|as of)\s+(?:release\s+|version\s+)?v?{ver}\b')
          vernoun=re.compile(rf'(?i)\b(?:the\s+)?v?{ver}\s+(migration|architecture|release|baseline|series|line|model|contract|layer|restructuring)\b')
          deleted_ref=re.compile(r'(?i)(?:CHANGELOG(?:[-_][^\s)\]]*)?\.md|DEPENDENCY_BOUNDARIES\.md|OPTIMISATIONS\.md|PLATFORM_ABSTRACTIONS\.md|SECURITY_INTEGRATION\.md|(?:^|[/`])wiki/[^\s)`\]]*)')
          arduino=re.compile(rf'(?i)Arduino-ESP32\s+{ver}')

          def clean(s):
              saved=[]
              def hold(m): saved.append(m.group(0)); return f'@@EXTVER{len(saved)-1}@@'
              s=arduino.sub(hold,s)
              s=libver.sub(lambda m:m.group(1),s)
              s=history.sub(lambda m:m.group(1),s)
              s=since.sub('',s)
              s=vernoun.sub(lambda m:m.group(1),s)
              s=re.sub(r'\b1\.0\.0\b','',s)
              for i,v in enumerate(saved): s=s.replace(f'@@EXTVER{i}@@',v)
              s=re.sub(r'\s+([,.;:])',r'\1',s)
              return s

          docs={'.md','.markdown','.rst','.adoc','.svg'}
          code={'.h','.hh','.hpp','.hxx','.c','.cc','.cpp','.cxx','.ipp','.tpp','.ino'}
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or p==self_path: continue
              ext=p.suffix.lower()
              if ext in docs:
                  try: old=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  out=[]
                  for line in old.splitlines(keepends=True):
                      nl='\n' if line.endswith('\n') else ''
                      body=line[:-1] if nl else line
                      if deleted_ref.search(body): continue
                      if re.match(r'^#{1,6}\s+(?:Changelog|Release History|Version History)\s*$',body,re.I): continue
                      new=clean(body)
                      if new!=body: new=new.rstrip()
                      out.append(new+nl)
                  new=''.join(out)
                  if new!=old:
                      new=new.rstrip('\n')+'\n'
                      p.write_text(new,encoding='utf-8')
              elif ext in code:
                  try: old=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  out=[]; i=0; block=False; quote=None
                  while i<len(old):
                      if block:
                          j=old.find('*/',i)
                          if j<0: out.append(clean(old[i:])); i=len(old); break
                          out.append(clean(old[i:j])); out.append('*/'); i=j+2; block=False; continue
                      ch=old[i]
                      if quote:
                          out.append(ch)
                          if ch=='\\' and i+1<len(old): out.append(old[i+1]); i+=2; continue
                          if ch==quote: quote=None
                          i+=1; continue
                      if ch in {'"',"'"}: quote=ch; out.append(ch); i+=1; continue
                      if old.startswith('//',i):
                          j=old.find('\n',i); j=len(old) if j<0 else j
                          out.append('//'+clean(old[i+2:j])); i=j; continue
                      if old.startswith('/*',i): out.append('/*'); i+=2; block=True; continue
                      out.append(ch); i+=1
                  new=''.join(out)
                  if new!=old: p.write_text(new,encoding='utf-8')

          if self_path.exists(): self_path.unlink()
      - name: Verify flattened state
        shell: python
        run: |
          import pathlib,re,sys
          r=pathlib.Path('.'); bad=[]
          named={'dependency_boundaries.md','optimisations.md','platform_abstractions.md','security_integration.md'}
          for p in r.iterdir():
              if p.is_file() and (p.name.lower() in named or (p.name.lower().startswith('changelog') and p.suffix.lower()=='.md')): bad.append(str(p))
          if (r/'wiki').exists(): bad.append('wiki/')
          for p in r.rglob('*'):
              if p.is_file() and p.suffix.lower()=='.md':
                  n=p.name.lower()
                  if n.startswith('changelog') or n.startswith('release_notes') or n.startswith('release-notes') or re.match(r'release[_-]\d',n): bad.append(str(p))
          ver=r'\d+\.(?:\d+|x)(?:\.(?:\d+|x))?(?:[-+][0-9A-Za-z.-]+)?'
          libs=r'(?:Command|ESP-Now|ESP32|Event|Logging|MeshAdapters|Mesh|NRF24|Observable|Persistence|Primitive|Radio|Security|Serial|Serializable|Sockets|State|System|Task|Threads|Timing|Units|Web|WiFi)'
          suspect=re.compile(rf'(?i)(?:\b(?:ESPressio[- ]?)?{libs}\s+(?:v(?:ersion)?\s*)?(?:[<>=~^]+\s*)?{ver}|\b(?:introduced|added|changed|fixed|removed|updated|corrected|released|implemented|established|raised|lowered|migrated)\s+(?:back\s+)?in\s+(?:release\s+|version\s+)?v?{ver}|\b(?:since|as of)\s+(?:release\s+|version\s+)?v?{ver}|\b1\.0\.0\b)')
          docs={'.md','.markdown','.rst','.adoc','.svg'}; code={'.h','.hh','.hpp','.hxx','.c','.cc','.cpp','.cxx','.ipp','.tpp','.ino'}
          def comments(t):
              z=[];i=0;b=False;q=None
              while i<len(t):
                  if b:
                      j=t.find('*/',i)
                      if j<0:z.append(t[i:]);break
                      z.append(t[i:j]);i=j+2;b=False;continue
                  c=t[i]
                  if q:
                      if c=='\\' and i+1<len(t):i+=2;continue
                      if c==q:q=None
                      i+=1;continue
                  if c in {'"',"'"}:q=c;i+=1;continue
                  if t.startswith('//',i):
                      j=t.find('\n',i);j=len(t) if j<0 else j;z.append(t[i+2:j]);i=j;continue
                  if t.startswith('/*',i):b=True;i+=2;continue
                  i+=1
              return '\n'.join(z)
          for p in r.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in docs|code:continue
              try:t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              scan=t if p.suffix.lower() in docs else comments(t)
              for n,line in enumerate(scan.splitlines(),1):
                  # Arduino-ESP32 is an external framework version, not ESPressio release history.
                  check=re.sub(rf'(?i)Arduino-ESP32\s+{ver}','',line)
                  if suspect.search(check):bad.append(f'{p}:{n}:{line}')
          if bad: print('\n'.join(bad));sys.exit(1)
      - name: Commit flattened tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: flatten historical release references'
          git push origin HEAD:primitives_redesign
