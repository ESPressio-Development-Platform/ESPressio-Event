name: Temporary Residual Release-History Cleanup

on:
  workflow_call:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitives_redesign
          fetch-depth: 0

      - name: Remove residual historical release references
        shell: python
        run: |
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"].split("/")[-1]

          def replace(path, old, new, required=True):
              p = Path(path)
              if not p.exists():
                  if required:
                      raise RuntimeError(f"missing expected file: {path}")
                  return
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  if required:
                      raise RuntimeError(f"expected text not found in {path}: {old[:100]!r}")
                  return
              p.write_text(text.replace(old, new), encoding="utf-8")

          if repo == "ESPressio-System":
              replace("README.md", "\n**Release target:** `0.1.0`\n", "")

          elif repo == "ESPressio-ESP32":
              replace("README.md", "\n**Release target:** `0.1.0`\n", "")

          elif repo == "ESPressio-Security":
              replace("README.md", "\n## Current Version — 0.4.2\n", "")
              replace(
                  "README.md",
                  "During the release restructuring, the optional Security Event integration is validated against ESPressio Event `main` and the current ESPressio Serializable dependency chain on `main`. The data-protection and transport-security APIs introduced through 0.4.0 are unchanged.",
                  "The optional Security Event integration consumes ESPressio Event and the current ESPressio Serializable dependency chain. The data-protection and transport-security APIs are retained unchanged during the active platform-abstraction tranche."
              )

          elif repo == "ESPressio-Timing":
              replace("README.md", "This working branch no longer requires consumers to include ESP-IDF timer headers or handle `esp_err_t`/GPTimer-native types in Timing APIs. The published-version information below is retained as release-history guidance until the staged Timing release is prepared.\n\n## Latest Stable Version\n\nThe current version is **2.2.8**.\n", "This working branch no longer requires consumers to include ESP-IDF timer headers or handle `esp_err_t`/GPTimer-native types in Timing APIs.\n")
              replace("README.md", "Version `2.2.0` adds first-class Observer notifications throughout meaningful Timing state transitions, using ESPressio Observable. The synchronization and generic `TTime` architecture introduced/2.1 remains unchanged.", "Timing provides first-class Observer notifications throughout meaningful Timing state transitions using ESPressio Observable. The synchronization and generic `TTime` architecture remains unchanged.")
              replace("README.md", "Version `2.2.0` makes **ESPressio Observable** a required dependency and adds observer interfaces for meaningful Timing operations.", "**ESPressio Observable** is a required dependency and Timing exposes observer interfaces for meaningful Timing operations.")
              replace("README.md", "Version `2.1.0` adds a transport-independent synchronization and clock-discipline layer to the shared `SystemClockCore`.", "Timing provides a transport-independent synchronization and clock-discipline layer to the shared `SystemClockCore`.")

          elif repo == "ESPressio-Observable":
              replace("README.md", "## Release candidate\n\nThis working branch is being prepared for **4.0.0**. The major-version change reflects the new RTTI-free typed observer registry and the wider platform consolidation. Do not use the old documentation as an API guide for this branch.", "## Active working branch\n\nThis working branch contains the RTTI-free typed observer registry and wider platform consolidation. Its documentation describes the current working API.")
              replace("README.md", "Observable depends on ESPressio-System for allocator-aware storage. During the coordinated release-candidate phase the working branches are used together; published 4.0.0 metadata will target the corresponding released System generation.", "Observable depends on ESPressio-System for allocator-aware storage. During coordinated development, the matching working branches are used together.")

          elif repo == "ESPressio-Persistence":
              replace("README.md", "\n## Current version — 0.3.2\n", "")
              replace("README.md", "During the release restructuring, typed persistence is validated against ESPressio Serializable `main`, and protected typed persistence is validated against ESPressio Security `main`. The public storage and persistence APIs introduced through 0.3.0 are unchanged.", "Typed persistence consumes ESPressio Serializable, and protected typed persistence consumes ESPressio Security. The public storage and persistence APIs remain unchanged during the active platform-abstraction tranche.")
              replace("ESPRESSIO_DEPENDENCY_CHART.md", "# ESPressio Persistence dependency position — 0.3.2", "# ESPressio Persistence dependency position")
              replace("ESPRESSIO_DEPENDENCY_CHART.md", "Persistence core 0.3.2", "Persistence core")

          elif repo == "ESPressio-Serial":
              replace("README.md", "\n## Current Version — 0.8.1\n", "")
              replace("README.md", "0.8.1 is the current released baseline. This feature branch does not change version numbering. It removes the former Serial-owned Logger, logging record types, Sink abstraction and diagnostic ring buffer, and consumes the new `ESPressio-Logging` abstraction instead.", "This working branch removes the former Serial-owned Logger, logging record types, Sink abstraction and diagnostic ring buffer, and consumes the `ESPressio-Logging` abstraction instead.")

          elif repo == "ESPressio-Serializable":
              cmake = Path("tests/CMakeLists.txt")
              text = cmake.read_text(encoding="utf-8")
              for old in [
                  "add_executable(espressio_serializable_v06_tests test_v06.cpp)\n",
                  "target_include_directories(espressio_serializable_v06_tests PRIVATE ${SERIALIZABLE_INCLUDES})\n",
                  "add_test(NAME ESPressioSerializableV06Tests COMMAND espressio_serializable_v06_tests)\n",
              ]:
                  if old not in text:
                      raise RuntimeError(f"expected historical test registration missing: {old!r}")
                  text = text.replace(old, "")
              cmake.write_text(text, encoding="utf-8")
              for path in [
                  "tests/test_v06.cpp",
                  "tests/vectors/README.md",
                  "tests/vectors/v0.6.1/vector_state.binary.hex",
                  "tests/vectors/v0.6.1/vector_state.cbor.hex",
                  "tests/vectors/v0.6.1/vector_state.json",
              ]:
                  p = Path(path)
                  if not p.exists():
                      raise RuntimeError(f"missing historical fixture: {path}")
                  p.unlink()

          elif repo == "ESPressio-Sockets":
              replace("README.md", "The active `feature/state-transport-major-release` branch includes transport-neutral State integration and the platform-abstraction work staged for the later coordinated release restructuring. The package version remains `0.7.3` during this development tranche; version changes are intentionally deferred.", "The active working branch includes transport-neutral State integration and the platform-abstraction work for the coordinated structural redesign.")
              replace("README.md", "## Current package version", "## Package")
              replace("COMMAND_INTEGRATION.md", "    espressio-development-platform/ESPressio-Sockets@^0.7.1\n    espressio-development-platform/ESPressio-Command@^1.0.1", "    https://github.com/ESPressio-Development-Platform/ESPressio-Sockets.git#primitives_redesign\n    https://github.com/ESPressio-Development-Platform/ESPressio-Command.git#primitives_redesign")

          elif repo == "ESPressio-Threads":
              replace("README.md", "The published-version sections and older examples below are retained as **release-history documentation** until the staged Threads release/documentation consolidation is completed. Where those historical sections describe direct FreeRTOS ownership or use native calls inside examples, they describe the published line rather than the architecture of this active working branch.\n\n## Current Source Version\nThis source tree is version **3.1.7**.\n\nRefer to the GitHub Releases page for the latest published release/tag.\n", "The documentation below describes the architecture of this active working branch.\n")
              replace("README.md", "ESPressio Threads `3.1.7` targets the **ESP32 family under Arduino-ESP32**.", "ESPressio Threads targets the **ESP32 family under Arduino-ESP32**.")
              replace("README.md", "This is a critical 3.1.7 stability guarantee:", "This is a critical stability guarantee:")
              replace("README.md", "The source architecture remains intentionally close to ESP-IDF and the repository retains its CMake/component files, but the `3.1.7` PlatformIO package does **not currently advertise pure ESP-IDF framework support** because the published ESPressio Timing/Units dependency chain does not yet advertise the same framework compatibility.", "The source architecture remains intentionally close to ESP-IDF and the repository retains its CMake/component files, but the PlatformIO package does **not currently advertise pure ESP-IDF framework support** because the ESPressio Timing/Units dependency chain does not yet advertise the same framework compatibility.")
              replace("README.md", "\n> **Critical release replacement:** the originally published 3.1.7 implementation used FreeRTOS TLS index 0 for task-deletion bookkeeping and is invalidated by issue #67. The corrected 3.1.7 removes that mechanism entirely. For this critical correction only, normal semantic-versioning rules are intentionally overridden and the existing release/tag is expected to be replaced rather than advanced to a new version.\n", "")
              replace("README.md", "Version `3.1.0` extends ESPressio Threads' existing per-Thread Observer model to the process-wide threading infrastructure.", "ESPressio Threads extends its per-Thread Observer model to the process-wide threading infrastructure.")
              replace("README.md", "The 3.1 Observer surface is intentionally synchronous and transport/event agnostic.", "The Observer surface is intentionally synchronous and transport/event agnostic.")

          elif repo == "ESPressio-Units":
              replace("README.md", "\n## Current Version — 0.2.7\n", "")
              replace("README.md", "Version retains the comprehensive Units API and validates optional Serializable Unit variants against ESPressio Serializable `main`. Ordinary Unit types remain independent of Serializable.", "The library retains the comprehensive Units API and validates optional Serializable Unit variants against ESPressio Serializable. Ordinary Unit types remain independent of Serializable.")

          elif repo == "ESPressio-WiFi":
              replace("README.md", "\n## Version — 0.2.1\n", "")
              replace("README.md", "0.2.0 added three core capabilities retained unchanged by this 0.2.1 dependency-maintenance release:", "The library provides three core capabilities:")
              replace("README.md", "Threads is required because autonomous WiFi servicing is core 0.2.x behaviour.", "Threads is required because autonomous WiFi servicing is core behaviour.")

          else:
              raise RuntimeError(f"unexpected repository: {repo}")

      - name: Remove caller and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/primitives-redesign-release-residual-cleanup.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove residual historical release references"
          git push origin HEAD:primitives_redesign
