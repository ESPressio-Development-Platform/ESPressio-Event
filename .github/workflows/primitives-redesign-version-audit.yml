name: Temporary Residual Version Audit
on:
  push:
    branches: [primitives_redesign]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: primitives_redesign}
      - name: List release-like versions in documentation and code comments
        shell: python
        run: |
          import pathlib,re
          v=re.compile(r'(?<![\w.])\d+\.\d+(?:\.\d+)?(?:[-+][0-9A-Za-z.-]+)?')
          docs={'.md','.markdown','.rst','.adoc','.svg'}
          code={'.h','.hh','.hpp','.hxx','.c','.cc','.cpp','.cxx','.ipp','.tpp','.ino'}
          def comments(t):
              z=[];i=0;b=False;q=None
              while i<len(t):
                  if b:
                      j=t.find('*/',i)
                      if j<0:z.append(t[i:]);break
                      z.append(t[i:j]);i=j+2;b=False;continue
                  c=t[i]
                  if q:
                      if c=='\\' and i+1<len(t):i+=2;continue
                      if c==q:q=None
                      i+=1;continue
                  if c in {'"',"'"}:q=c;i+=1;continue
                  if t.startswith('//',i):
                      j=t.find('\n',i);j=len(t) if j<0 else j;z.append(t[i+2:j]);i=j;continue
                  if t.startswith('/*',i):b=True;i+=2;continue
                  i+=1
              return '\n'.join(z)
          for p in sorted(pathlib.Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts or p.name=='CMakeLists.txt' or p.suffix.lower() not in docs|code:continue
              try:t=p.read_text(encoding='utf-8')
              except:continue
              scan=t if p.suffix.lower() in docs else comments(t)
              for n,line in enumerate(scan.splitlines(),1):
                  if v.search(line):print(f'{p}:{n}:{line}')
